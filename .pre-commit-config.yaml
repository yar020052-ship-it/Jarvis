repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        language_version: python3.12
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^core/
        args: [--ignore-missing-imports, --follow-imports=silent]
  - repo: https://github.com/pre-commit/pyright
    rev: v1.1.382
    hooks:
      - id: pyright
        files: ^core/
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: .venv/Scripts/python -m pytest -q
        language: system
        pass_filenames: false
        always_run: true