name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run tests
        run: python -m pytest -q --cov=core --cov-report=term-missing --cov-fail-under=15
      - name: Health check
        run: python -c "from autonomy import health; r=health.run_health(); print(r.text()); raise SystemExit(0 if r.ok else 1)"